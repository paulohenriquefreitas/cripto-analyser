brapi.token=${BRAPI_TOKEN:}
# One live contract per application/capture session. Restart to change contracts.
mt5.symbol=${MT5_SYMBOL:WINZ26}
panic-scanner.momentum.lookback-days=90
panic-scanner.win.context-timeframe=5m
panic-scanner.win.execution-timeframe=1m
panic-scanner.win.rsi.oversold=30
panic-scanner.win.rsi.overbought=70
panic-scanner.win.trend.minimum-adx=20
panic-scanner.win.extension.maximum-ema21-distance-atr=2.0
panic-scanner.win.extension.consecutive-candles=3
panic-scanner.win.pullback.maximum-depth-atr=1.5
panic-scanner.win.execution.minimum-score=75
panic-scanner.win.risk.minimum-reward-risk=1.5
panic-scanner.win.risk.atr-stop-buffer=0.2
panic-scanner.win.consolidation.maximum-width-atr=2.2
win.market-data.provider=${WIN_MARKET_DATA_PROVIDER:mock}
profitdll.bridge.url=${PROFITDLL_BRIDGE_URL:ws://127.0.0.1:8765}
profitdll.ticker=${PROFITDLL_TICKER:WINFUT}
profitdll.exchange=${PROFITDLL_EXCHANGE:F}
profitdll.mock-warm-up-enabled=${PROFITDLL_MOCK_WARM_UP_ENABLED:true}
profitdll.mock-warm-up-candles=${PROFITDLL_MOCK_WARM_UP_CANDLES:50}
panic-scanner.replay.history-file=${PANIC_SCANNER_REPLAY_HISTORY_FILE:historical-data/{symbol}/{date}.ndjson}
panic-scanner.replay.python=${PANIC_SCANNER_REPLAY_PYTHON:python}
panic-scanner.replay.history-script=${PANIC_SCANNER_REPLAY_HISTORY_SCRIPT:panic-scanner/scripts/mt5_price_history.py}

# Volume Profile only: local session rules, never change the source timestamp/capture.
# Confirm against the configured B3 calendar and audited MT5 clock before setting true.
mt5.volume-profile.session-open=${MT5_PROFILE_SESSION_OPEN:09:00}
mt5.volume-profile.session-close=${MT5_PROFILE_SESSION_CLOSE:18:00}
mt5.volume-profile.holidays=${MT5_PROFILE_HOLIDAYS:}
mt5.volume-profile.calendar-confirmed=${MT5_PROFILE_CALENDAR_CONFIRMED:false}
# WINZ26 convention observed against Python/Java receipt and M1; source clock remains unverified.
mt5.volume-profile.feed-time-shift-minutes=${MT5_PROFILE_FEED_TIME_SHIFT_MINUTES:180}
mt5.volume-profile.time-basis-confirmed=${MT5_PROFILE_TIME_BASIS_CONFIRMED:false}

# FLOW only: raw feed + shift = UTC. Restart application after property changes.
# False exposes the unvalidated basis in every FLOW snapshot; never infer validation from activity.
mt5.flow.feed-time-shift-minutes=${MT5_FLOW_FEED_TIME_SHIFT_MINUTES:180}
mt5.flow.time-basis-confirmed=${MT5_FLOW_TIME_BASIS_CONFIRMED:false}
